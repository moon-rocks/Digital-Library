<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projects · Digital Library Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase.js"></script>
    <script src="js/supabase.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Digital Library<small>ADMIN PORTAL</small></div>
            <nav class="nav">
                <a href="index.html">▦ Dashboard</a><a href="resources.html">▤ Resources</a><a
                    href="add-resource.html">＋ Add Resource</a><a class="active" href="projects.html">⌘ Projects</a><a
                    href="website.html">⌂ Website</a><a href="media.html">▧ Media</a><a href="settings.html">⚙
                    Settings</a>
            </nav>
            <div class="sidebar-bottom"><button class="btn" data-logout style="width:100%">Logout</button></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <h1>Project Verification</h1><span class="demo-pill">STUDENT PROJECTS</span>
            </div>
            <div class="grid" style="grid-template-columns:repeat(3,1fr)">
                <div class="card metric">
                    <div class="label">Pending</div>
                    <div class="value" id="pending">—</div>
                </div>
                <div class="card metric">
                    <div class="label">Approved</div>
                    <div class="value" id="approved">—</div>
                </div>
                <div class="card metric">
                    <div class="label">Rejected</div>
                    <div class="value" id="rejected">—</div>
                </div>
            </div>
            <div class="card section">
                <div class="section-head">
                    <h2 id="listTitle">Pending Submissions</h2><button class="btn" id="refresh">Refresh</button>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">
                    <button class="btn primary" data-status="pending">Pending</button>
                    <button class="btn" data-status="approved">Approved</button>
                    <button class="btn" data-status="rejected">Rejected</button>
                </div>
                <div id="list" class="empty">Loading...</div>
            </div>
        </main>
    </div>
    <script>
        const $ = s => document.querySelector(s); const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
        async function init() {
            const c = window.supabaseClient || supabase.createClient(window.DIGITAL_LIBRARY_CONFIG.url, window.DIGITAL_LIBRARY_CONFIG.anonKey);
            const { data: session } = await c.auth.getSession(); if (!session.session) { location.href = "login.html"; return; }
            const { data: admin } = await c.from("admin_users").select("user_id").eq("user_id", session.session.user.id).eq("role", "admin").eq("active", true).maybeSingle(); if (!admin) { location.href = "login.html"; return; }
            let selectedStatus = "pending";
            const titles = { pending: "Pending Submissions", approved: "Approved Submissions", rejected: "Rejected Submissions" };
            const statusLabel = status => status.charAt(0).toUpperCase() + status.slice(1);
            const links = x => `${x.github_url ? `<a class="btn" target="_blank" rel="noopener" href="${esc(x.github_url)}">GitHub</a>` : ""}${x.live_url ? `<a class="btn" target="_blank" rel="noopener" href="${esc(x.live_url)}">Live Demo</a>` : ""}`;
            const submissionCard = x => `<div class="card" style="margin:12px 0;border:1px solid #e7ebf2"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h3 style="margin:0 0 8px">${esc(x.title)}</h3><div class="muted">Student: ${esc(x.student_name)} · Team members: ${esc(x.team_members || "—")}</div><div class="muted">${esc(x.department || "—")} · Semester ${esc(x.semester || "—")}</div><p>${esc(x.description)}</p><div class="muted">${esc(x.tech_stack || "")}</div>${x.rejection_reason ? `<p class="muted">Reason: ${esc(x.rejection_reason)}</p>` : ""}</div><span class="demo-pill">${statusLabel(x.verification_status).toUpperCase()}</span></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${links(x)}${x.verification_status === "pending" ? `<button class="btn primary" onclick="approve('${x.id}')">✓ Approve</button><button class="btn danger" onclick="rejectProject('${x.id}')">✕ Reject</button>` : ""}${x.verification_status === "rejected" ? `<button class="btn danger" onclick="deleteRejected('${x.id}')">Delete</button>` : ""}</div></div>`;
            async function load() {
                const { data, error } = await c.from("project_submissions").select("*").order("submitted_at", { ascending: false });
                if (error) {
                    ["pending", "approved", "rejected"].forEach(s => $("#" + s).textContent = "—");
                    $("#list").textContent = error.message.includes("project_submissions")
                        ? "Project approval is not configured. Run supabase.sql in your Supabase project, then refresh this page."
                        : error.message;
                    return;
                }
                const rows = data || [];
                ["pending", "approved", "rejected"].forEach(s => $("#" + s).textContent = rows.filter(x => x.verification_status === s).length);
                const visibleRows = rows.filter(x => x.verification_status === selectedStatus);
                $("#listTitle").textContent = titles[selectedStatus];
                $("#list").innerHTML = visibleRows.length ? visibleRows.map(submissionCard).join("") : `<div class="empty">No ${selectedStatus} submissions.</div>`;
            }
            window.approve = async id => { const r = await c.from("project_submissions").select("*").eq("id", id).eq("verification_status", "pending").single(); if (r.error) return alert(r.error.message); const x = r.data; let thumb = null; if (x.thumbnail_path) { thumb = c.storage.from("project-images").getPublicUrl(x.thumbnail_path).data.publicUrl } const ins = await c.from("projects").insert({ title: x.title, description: x.description, department: x.department, semester: x.semester, project_status: x.project_status, verification_status: "approved", tech_stack: x.tech_stack, github_url: x.github_url, live_url: x.live_url, thumbnail_url: thumb, thumbnail_path: x.thumbnail_path, project_file_path: x.project_file_path, student_name: x.student_name, team_members: x.team_members }).select().single(); if (ins.error) return alert(ins.error.message); const update = await c.from("project_submissions").update({ verification_status: "approved", reviewed_by: session.session.user.id, reviewed_at: new Date().toISOString() }).eq("id", id).eq("verification_status", "pending"); if (update.error) { await c.from("projects").delete().eq("id", ins.data.id); return alert(update.error.message) } load(); };
            window.rejectProject = async id => { const reason = prompt("Reason for rejection (optional):") || null; const result = await c.from("project_submissions").update({ verification_status: "rejected", rejection_reason: reason, reviewed_by: session.session.user.id, reviewed_at: new Date().toISOString() }).eq("id", id).eq("verification_status", "pending"); if (result.error) return alert(result.error.message); load(); };
            window.deleteRejected = async id => { if (!confirm("Delete this rejected submission permanently?")) return; const result = await c.from("project_submissions").delete().eq("id", id).eq("verification_status", "rejected"); if (result.error) return alert(result.error.message); load(); };
            document.querySelectorAll("[data-status]").forEach(button => button.onclick = () => { selectedStatus = button.dataset.status; document.querySelectorAll("[data-status]").forEach(item => item.classList.toggle("primary", item === button)); load(); });
            $("#refresh").onclick = load; load();
        }
        document.addEventListener("DOMContentLoaded", init);
    </script>
    <script src="js/auth.js"></script>
</body>

</html>
