<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resources · Digital Library Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase.js"></script>
    <script src="../config/storage.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Digital Library<small>ADMIN PORTAL</small></div>
            <nav class="nav"><a class="" href="index.html">▦ Dashboard</a><a class="active" href="resources.html">▤
                    Resources</a><a class="" href="add-resource.html">＋ Add Resource</a><a class=""
                    href="website.html">⌂ Website</a><a class="" href="announcements.html">◉ Announcements</a><a
                    class="" href="media.html">▧ Media</a><a class="" href="settings.html">⚙ Settings</a></nav>
            <div class="sidebar-bottom"><button class="btn" data-logout style="width:100%">Logout</button></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <div><button class="btn mobile-menu" id="menuBtn">☰</button>
                    <h1>Resources</h1>
                </div>
                <div style="display:flex;gap:8px;align-items:center"><span class="demo-pill">DEMO MODE</span><button
                        class="btn" id="themeBtn">◐ Theme</button></div>
            </div>
            <div class="card">
                <div class="toolbar"><input id="search" class="input" placeholder="Search resources..."><select
                        id="type" class="select">
                        <option value="">All Types</option>
                        <option>Book</option>
                        <option>Notes</option>
                        <option>PYQ</option>
                        <option>Lab Manual</option>
                        <option>Syllabus</option>
                        <option>Cheatsheet</option>
                        <option>Publication</option>
                        <option>Newsletter</option>
                        <option>Magazine</option>
                    </select><select id="status" class="select">
                        <option value="">All Status</option>
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                    </select><a class="btn primary" href="add-resource.html">＋ Add Resource</a></div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Branch</th>
                                <th>Sem</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="resourceRows">
                            <tr>
                                <td colspan="8" class="empty">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <script src="js/resources.js"></script>
        </main>
    </div>
    <script src="js/supabase.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
