<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>settings.html · Digital Library Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase.js"></script>
    <script src="../config/storage.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Digital Library<small>ADMIN PORTAL</small></div>
            <nav class="nav"><a class="" href="index.html">▦ Dashboard</a><a class="" href="resources.html">▤
                    Resources</a><a class="" href="add-resource.html">＋ Add Resource</a><a class=""
                    href="website.html">⌂ Website</a><a class="" href="announcements.html">◉ Announcements</a><a
                    class="" href="media.html">▧ Media</a><a class="active" href="settings.html">⚙ Settings</a></nav>
            <div class="sidebar-bottom"><button class="btn" data-logout style="width:100%">Logout</button></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <div><button class="btn mobile-menu" id="menuBtn">☰</button>
                    <h1>Settings</h1>
                </div>
                <div style="display:flex;gap:8px;align-items:center"><span class="demo-pill">DEMO MODE</span><button
                        class="btn" id="themeBtn">◐ Theme</button></div>
            </div>
            <div class="card form-grid">
                <div class="field"><label>Website Name</label><input class="input" value="Digital Library"></div>
                <div class="field"><label>Contact Email</label><input class="input" type="email"></div>
                <div class="field full"><label>Website Description</label><textarea class="textarea"></textarea></div>
                <div class="field"><label>Footer Text</label><input class="input" value="Digital Library"></div>
                <div class="field"><label>Maintenance Mode</label><select class="select">
                        <option>Off</option>
                        <option>On</option>
                    </select></div>
                <div class="field full"><button class="btn primary"
                        onclick="toast('Settings UI ready. Connect site_settings table to save.')">Save
                        Settings</button></div>
            </div>
        </main>
    </div>
    <script src="js/supabase.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
